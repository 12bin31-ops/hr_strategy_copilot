[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-strategy-copilot"
version = "0.1.0"
description = "HR 제도 기획·인력운영 의사결정 지원 시스템 (RAG + Multi-Agent)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
agents = ["crewai>=0.80", "crewai-tools>=0.17", "litellm>=1.50"]
app = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
hrx = "hrx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
