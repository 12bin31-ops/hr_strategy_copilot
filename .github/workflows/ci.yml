name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" tabulate

      - name: Lint
        run: ruff check src tests

      - name: Build data & index
        run: |
          hrx data
          hrx index

      - name: Test
        run: pytest -q --cov=hrx --cov-report=term-missing

      # LLM 키 없이도 검색·근거 품질이 기준선을 지키는지 확인한다.
      - name: Retrieval quality gate
        run: hrx eval --min-recall 0.90

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports/
